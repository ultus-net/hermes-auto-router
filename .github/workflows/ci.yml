name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tooling
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v

  branch-prefix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require an allowed branch prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/*|fix/*|chore/*|docs/*|experiment/*|hotfix/*|refactor/*) ;;
            *)
              echo "branch '$BRANCH' must start with feature/, fix/, chore/, docs/, experiment/, hotfix/, or refactor/"
              exit 1
              ;;
          esac
